name: Release

# Stable releases are automatic: a merge into master with a new version creates the v<version> tag and a GitHub Release
# with generated notes. Pre-releases are published by hand from the Releases page, from any branch, and the check job
# fails if one is wrong. RELEASING.md has the steps.

on:
  push:
    branches: [master]
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    concurrency:
      group: release-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the checks compare against every v* tag

      - name: Release this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 .github/scripts/plugin_version.py version)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          python3 .github/scripts/plugin_version.py check --stable --unreleased

          # Notes list the pull requests merged since the last stable release, skipping pre-releases.
          notes=(--generate-notes)
          previous=$(python3 .github/scripts/plugin_version.py last-release)
          if [[ -n "$previous" ]]; then
            notes+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --latest "${notes[@]}"
          echo "Released $tag."

  # A release created by the publish job does not start this job: GitHub doesn't trigger workflows from events that
  # the workflow token causes. It checks the releases people publish by hand.
  check:
    name: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the checks need master and every v* tag

      - name: Check the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          STABLE_REF: origin/master
        run: python3 .github/scripts/plugin_version.py release
