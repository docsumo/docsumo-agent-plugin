name: Validate

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

jobs:
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main check compares against main and every v* tag

      - name: Check that both manifests carry the same valid version
        run: python3 .github/scripts/plugin_version.py check

      # Clients install from main and only update when the version changes, so every change to main needs a higher
      # stable version. The merge then releases it (release.yml).
      - name: Check that the version is raised (pull requests into main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 .github/scripts/plugin_version.py check --stable --newer-than origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate the plugin and the marketplace with Claude Code
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate .claude-plugin/marketplace.json
